[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gigai"
version = "1.0.0"
description = "Intelligent event-driven workflow automation for construction material change coordination"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Company", email = "engineering@yourcompany.com"}
]
maintainers = [
    {name = "Engineering Team", email = "engineering@yourcompany.com"}
]
keywords = [
    "construction",
    "material-management",
    "workflow-automation",
    "ai",
    "claude",
    "rag",
    "pgvector",
    "fastapi"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "websockets>=12.0",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.25",
    "pgvector>=0.2.4",
    "anthropic>=0.18.1",
    "voyageai>=0.2.1",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "requests>=2.31.0",
    "google-auth>=2.27.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.116.0",
    "pyyaml>=6.0.1",
    "python-json-logger>=2.0.7",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=42.0.2",
    "structlog>=24.1.0",
    "python-dateutil>=2.8.2",
    "pytz>=2024.1",
    "tenacity>=8.2.3",
    "markdown>=3.5.2"
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.26.0",
    "black>=24.1.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "ipython>=8.20.0",
    "ipdb>=0.13.13"
]

# Production dependencies
prod = [
    "gunicorn>=21.2.0",
    "sentry-sdk>=1.40.0",
    "prometheus-client>=0.19.0"
]

# Optional cloud dependencies
cloud = [
    "google-cloud-pubsub>=2.19.0",
    "google-cloud-logging>=3.9.0"
]

# Optional task queue
queue = [
    "celery[redis]>=5.3.4",
    "redis>=5.0.1"
]

# All optional dependencies
all = [
    "gigai[dev,prod,cloud,queue]"
]

[project.urls]
Homepage = "https://github.com/yourcompany/gigai"
Documentation = "https://github.com/yourcompany/gigai/docs"
Repository = "https://github.com/yourcompany/gigai"
Issues = "https://github.com/yourcompany/gigai/issues"
Changelog = "https://github.com/yourcompany/gigai/blob/main/CHANGELOG.md"

[project.scripts]
gigai = "src.main:main"

# ============================================
# TOOL CONFIGURATION
# ============================================

[tool.setuptools]
package-dir = {"" = "."}
packages = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.txt", "*.md"]

# ============================================
# PYTEST CONFIGURATION
# ============================================

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
    "requires_api: Tests that require external API access",
    "requires_db: Tests that require database access"
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/virtualenv/*"
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod"
]

[tool.coverage.html]
directory = "htmlcov"

# ============================================
# BLACK CONFIGURATION (CODE FORMATTING)
# ============================================

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

# ============================================
# ISORT CONFIGURATION (IMPORT SORTING)
# ============================================

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
skip = [
    ".git",
    ".mypy_cache",
    ".tox",
    ".venv",
    "venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "migrations"
]
known_first_party = ["src"]
known_third_party = [
    "fastapi",
    "pydantic",
    "anthropic",
    "voyageai",
    "psycopg2",
    "asyncpg",
    "pgvector"
]
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER"
]

# ============================================
# MYPY CONFIGURATION (TYPE CHECKING)
# ============================================

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_optional = true
strict_equality = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
show_error_codes = true
show_column_numbers = true
pretty = true

# Exclude paths
exclude = [
    "venv/",
    ".venv/",
    "build/",
    "dist/",
    "tests/",
    "migrations/"
]

# Per-module options
[[tool.mypy.overrides]]
module = [
    "anthropic.*",
    "voyageai.*",
    "pgvector.*",
    "google.*",
    "psycopg2.*"
]
ignore_missing_imports = true

# ============================================
# RUFF CONFIGURATION (LINTING)
# ============================================

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ============================================
# BANDIT CONFIGURATION (SECURITY LINTING)
# ============================================

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101", "B601"]  # Skip assert_used, paramiko_calls

# ============================================
# ADDITIONAL METADATA
# ============================================

[tool.setuptools_scm]
write_to = "src/_version.py"
write_to_template = "__version__ = '{version}'"