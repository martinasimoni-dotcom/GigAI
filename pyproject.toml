[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gigai"
version = "0.1.0"
description = "GigAI decision intelligence MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.9.0",
  "google-api-python-client>=2.100.0",
  "google-auth-oauthlib>=1.1.0",
  "google-auth-httplib2>=0.1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0"
]
fireflies = [
  "requests>=2.31.0",
  "python-dotenv>=1.0.0"
]
rafik-llm = [
  "anthropic>=0.40.0"
]

[project.scripts]
gigai-api = "gigai.main:run"
gigai-trash = "gigai.trash_manager:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
